
[package]
authors = ["xiaohulu <76711619@qq.com>"]
edition = "2024"
name = "intent_ruoyi_vue_rust"
version = "0.0.10"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "3.12.2"
napi-derive = "3.6.3"
serde_json = "1"
quick-xml = "0.42.0"
heck = "0.5.0"
anyhow = "1"
chrono = "0.4.0"
oxc_allocator = "0.148.0"
oxc_ast = "0.148.0"
oxc_codegen = "0.148.0"
oxc_span = "0.148.0"
oxc_parser = "0.148.0"

[dependencies.serde]
version = "1"
features = ["derive"]

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
