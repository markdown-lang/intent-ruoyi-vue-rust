
[package]
authors = ["xiaohulu <76711619@qq.com>"]
edition = "2024"
name = "intent_ruoyi_vue_rust"
version = "0.0.2"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "3.9.0"
napi-derive = "3.5.6"
serde_json = "1"
quick-xml = "0.40.1"
heck = "0.5.0"
anyhow = "1"
git2 = "0.20.0"
url = "2.5.0"
log = "0.4"
uuid = { version = "1.23.1", features = ["v4"] }
chrono = "0.4.42"

[dependencies.serde]
version = "1"
features = ["derive"]

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
